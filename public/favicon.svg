<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy circle badge with golden rim -->
  <circle cx="50" cy="50" r="48" fill="#00274D" stroke="#F59E0B" stroke-width="3" />
  
  <!-- Subtle national tricolor indicator ring around the inner edge -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FF9933" stroke-width="2" stroke-dasharray="50 85" stroke-dashoffset="35" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#138808" stroke-width="2" stroke-dasharray="50 85" stroke-dashoffset="125" />

  <!-- State Emblem of India (Ashoka Lion Capital) in Gold -->
  <g fill="#FBBF24">
    <!-- Center Lion Head -->
    <path d="M50 14 C44 14 39 19 39 26 C39 32 43 37 46 39 C44 43 44 47 47 51 C45 54 45 58 50 60 C55 58 55 54 53 51 C56 47 56 43 54 39 C57 37 61 32 61 26 C61 19 56 14 50 14 Z" />
    <!-- Left Lion Head -->
    <path d="M39 24 C33 20 25 25 26 33 C27 38 31 42 34 44 C33 48 36 53 41 54 C41 49 39 44 40 41 C37 39 35 36 36 31 C36 27 38 25 39 24 Z" />
    <!-- Right Lion Head -->
    <path d="M61 24 C67 20 75 25 74 33 C73 38 69 42 66 44 C67 48 64 53 59 54 C59 49 61 44 60 41 C63 39 65 36 64 31 C64 27 62 25 61 24 Z" />
    <!-- Abacus Base -->
    <rect x="23" y="62" width="54" height="7" rx="1.5" fill="#F59E0B" />
    <!-- Ashoka Chakra -->
    <circle cx="50" cy="65.5" r="3.2" stroke="#FFFFFF" stroke-width="0.8" fill="#00274D" />
    <circle cx="50" cy="65.5" r="0.8" fill="#FFFFFF" />
    <!-- Lotus / Bell Base -->
    <path d="M25 71 C32 78 68 78 75 71 C69 80 31 80 25 71 Z" fill="#F59E0B" />
    <!-- Pedestal Base -->
    <rect x="22" y="80" width="56" height="3.5" rx="1" fill="#F59E0B" />
  </g>
</svg>